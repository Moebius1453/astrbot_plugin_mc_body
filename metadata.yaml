name: astrbot_plugin_mc_body # 插件唯一识别名
display_name: Minecraft 身体 # 展示名
short_desc: 通过独立 Minecraft 客户端，让 AstrBot 智能体以玩家身份参与游戏。 # 简短描述
desc: 需要额外运行 Minecraft 客户端，并部署配套 KubeJS 与 Baritone 环境。支持游戏聊天、感知、移动、物品交互、配方书合成、冶炼和程序任务，尽可能做到模拟真实玩家 目前已经取得了一定效果。 # 详细描述
version: v0.40.0 # 版本号
author: Moebius1453 # 作者
repo: https://github.com/Moebius1453/astrbot_plugin_mc_body # 仓库地址
astrbot_version: ">=4.27,<5" # 依赖的 AstrBot 版本范围

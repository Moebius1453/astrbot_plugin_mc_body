name: astrbot_plugin_mc_body # 插件唯一识别名
display_name: AI游玩Minecraft  # 展示名
short_desc: 通过独立 Minecraft 客户端，让 AstrBot 智能体以玩家身份参与游戏。 # 简短描述
desc: 需要额外运行 Minecraft 客户端，并部署配套 KubeJS 与 Baritone 环境。支持游戏聊天、感知、移动、物品交互、配方书合成、冶炼和程序任务，尽可能做到模拟真实玩家， 参考了言出法随等模组 专门基于上下文 对话记录和记忆感知连贯性做了调整  # 详细描述
version: 0.40.0 # 版本号
author: Moebius1453 # 作者
repo: https://github.com/Moebius1453/astrbot_plugin_mc_body # 仓库地址
astrbot_version: ">=4.27,<5" # 依赖的 AstrBot 版本范围
support_platforms: # 已实测的平台适配器；其他平台需自行验证
  - aiocqhttp
tags: # 插件市场标签
  - minecraft
  - 我的世界
  - 游戏
  - agent
  - baritone
